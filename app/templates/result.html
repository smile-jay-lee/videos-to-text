{% extends "base.html" %}

{% block title %}转写结果 - 语音转文字系统{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-10">
        <h2 class="mb-4">✅ 转写完成</h2>

        <div class="card shadow-sm mb-4">
            <div class="card-header bg-success text-white">
                <h5 class="mb-0">转写结果</h5>
            </div>
            <div class="card-body">
                <div class="mb-3">
                    <strong>任务ID：</strong>{{ task_id }}
                </div>
                <div class="mb-3">
                    <strong>文件名：</strong>{{ task.filename }}
                </div>
                <div class="mb-3">
                    <strong>文本长度：</strong>{{ result.text|length }} 字符
                </div>
                <hr>
                <h5>转写文本</h5>
                <div class="bg-light p-3 rounded" style="max-height: 400px; overflow-y: auto;">
                    <pre class="mb-0" style="white-space: pre-wrap; word-wrap: break-word;">{{ result.text }}</pre>
                </div>
            </div>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <h5 class="card-title">下载选项</h5>
                <div class="btn-group" role="group">
                    <a href="/api/download/{{ task_id }}/txt" class="btn btn-outline-primary">
                        📄 下载TXT文件
                    </a>
                </div>
            </div>
        </div>

        <div class="d-grid gap-2">
            <a href="/upload" class="btn btn-primary">处理新文件</a>
            <a href="/" class="btn btn-outline-secondary">返回首页</a>
        </div>
    </div>
</div>
{% endblock %}
